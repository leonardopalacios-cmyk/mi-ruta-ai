<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 RUTAS AI - ULTRA LOGISTICS</title>
    <style>
        :root {
            --primary: #00d4ff; --secondary: #7000ff; --accent: #2ecc71;
            --danger: #e94560; --bg: #05050a; --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        .sidebar {
            width: 420px; background: rgba(10, 10, 25, 0.95); backdrop-filter: blur(20px);
            padding: 25px; border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; overflow-y: auto; z-index: 100;
        }

        h1 { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 20px; }

        .input-group { margin-bottom: 12px; }
        label { font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        input, select {
            width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: white; font-size: 14px; outline: none; box-sizing: border-box;
        }

        /* Panel de Clima */
        .weather-panel {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.1);
            display: none; transition: 0.5s;
        }
        .weather-info { display: flex; align-items: center; justify-content: space-between; }
        .temp { font-size: 24px; font-weight: 900; color: var(--primary); }
        .condition { font-size: 12px; text-transform: uppercase; opacity: 0.8; }

        .safety-alert {
            font-size: 11px; padding: 8px; border-radius: 6px; margin-top: 10px;
            display: flex; align-items: center; gap: 8px;
        }
        .alert-ok { background: rgba(46, 204, 113, 0.1); color: var(--accent); }
        .alert-warn { background: rgba(233, 69, 96, 0.1); color: var(--danger); }

        /* Botones y Resultados */
        button {
            width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: 800;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-top: 10px;
        }
        .btn-calc { background: linear-gradient(45deg, var(--secondary), var(--primary)); color: white; }

        .results { margin-top: 20px; display: none; animation: fadeIn 0.5s ease; }
        .total-box { font-size: 32px; text-align: center; color: var(--accent); font-weight: 900; margin: 15px 0; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; text-align: center; }
        .stat-card small { display: block; font-size: 9px; color: var(--primary); margin-bottom: 4px; }

        #map-container { flex: 1; }
        iframe { width: 100%; height: 100%; border: none; filter: invert(90%) hue-rotate(180deg); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>RUTA AI ULTRA-LOGISTICS</h1>
    
    <div class="input-group">
        <label>📍 Origen</label>
        <input type="text" id="o" placeholder="Ej: Ciudad de México">
    </div>

    <div class="input-group">
        <label>🏁 Destino</label>
        <input type="text" id="d" placeholder="Ej: Guadalajara">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="input-group">
            <label>⛽ Gasolina $/L</label>
            <input type="number" id="p" value="24.50">
        </div>
        <div class="input-group">
            <label>🏎️ Rendimiento</label>
            <input type="number" id="r" value="12">
        </div>
    </div>

    <button class="btn-calc" onclick="procesarRuta()">Calcular con Clima Real</button>

    <div id="weather-panel" class="weather-panel">
        <div class="condition" id="dest-label">CLIMA EN DESTINO</div>
        <div class="weather-info">
            <span id="weather-icon" style="font-size: 40px;">☀️</span>
            <span class="temp" id="temp-txt">--°C</span>
        </div>
        <div id="safety-box" class="safety-alert alert-ok">
            ✅ Condiciones óptimas para conducir
        </div>
    </div>

    <div id="res-box" class="results">
        <div class="stats-grid">
            <div class="stat-card"><small>DISTANCIA</small><div id="dist-txt">--</div></div>
            <div class="stat-card"><small>TIEMPO (ETA)</small><div id="time-txt">--</div></div>
        </div>
        <div class="total-box" id="total-txt">$0.00</div>
        <button style="background:#25d366; color:white; font-size:12px;" onclick="compartir()">Enviar por WhatsApp</button>
    </div>
</div>

<div id="map-container">
    <iframe id="mapa" src="https://maps.google.com/maps?q=Mexico&output=embed"></iframe>
</div>

<script>
    async function procesarRuta() {
        const ori = document.getElementById('o').value;
        const des = document.getElementById('d').value;
        if(!ori || !des) return alert("Ingresa datos");

        // 1. Obtener Clima
        await obtenerClima(des);

        // 2. Calcular Lógica de Viaje
        calcularViaje(ori, des);
        
        // 3. Actualizar Mapa
        document.getElementById('mapa').src = `https://www.google.com/maps?q=${encodeURIComponent(ori)}+to+${encodeURIComponent(des)}&output=embed`;
    }

    async function obtenerClima(ciudad) {
        try {
            // Geocoding simple con OpenStreetMap (Gratis)
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(ciudad)}`);
            const geoData = await geoRes.json();
            
            if(geoData.length > 0) {
                const { lat, lon } = geoData[0];
                
                // Clima con Open-Meteo (Gratis)
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const weatherData = await weatherRes.json();
                
                const temp = weatherData.current_weather.temperature;
                const code = weatherData.current_weather.weathercode;

                actualizarUIClima(temp, code, ciudad);
            }
        } catch (e) {
            console.error("Error de clima", e);
        }
    }

    function actualizarUIClima(temp, code, ciudad) {
        const panel = document.getElementById('weather-panel');
        const tempTxt = document.getElementById('temp-txt');
        const icon = document.getElementById('weather-icon');
        const safety = document.getElementById('safety-box');
        
        panel.style.display = 'block';
        tempTxt.innerText = `${temp}°C`;
        document.getElementById('dest-label').innerText = `CLIMA EN ${ciudad.toUpperCase()}`;

        // Lógica de iconos y seguridad basada en Weather Codes
        if(code >= 51) { // Lluvia / Nieve
            icon.innerText = "🌧️";
            safety.innerHTML = "⚠️ Lluvia detectada. Reducir velocidad.";
            safety.className = "safety-alert alert-warn";
            window.weatherFactor = 0.8; // Reduce velocidad 20%
        } else {
            icon.innerText = "☀️";
            safety.innerHTML = "✅ Condiciones óptimas para conducir";
            safety.className = "safety-alert alert-ok";
            window.weatherFactor = 1;
        }
    }

    function calcularViaje(ori, des) {
        const pre = parseFloat(document.getElementById('p').value);
        const ren = parseFloat(document.getElementById('r').value);
        
        // Distancia simulada (En un entorno real usarías Distance Matrix API)
        const km = Math.floor(Math.abs(ori.length + des.length) * 15); 
        const casetas = Math.floor(km * 1.2);
        const fuel = (km / ren) * pre;
        const total = fuel + casetas;

        // Tiempo ajustado por clima
        let velocidadBase = 95;
        let tiempoDecimal = km / (velocidadBase * (window.weatherFactor || 1));
        let horas = Math.floor(tiempoDecimal);
        let mins = Math.round((tiempoDecimal - horas) * 60);

        document.getElementById('res-box').style.display = 'block';
        document.getElementById('dist-txt').innerText = km + " KM";
        document.getElementById('time-txt').innerText = `${horas}h ${mins}m`;
        document.getElementById('total-txt').innerText = "$" + total.toLocaleString();
        
        window.currentData = { ori, des, km, total, horas, mins };
    }

    function compartir() {
        const d = window.currentData;
        const msg = `🚩 *REPORTE DE RUTA AI*\n📍 Origen: ${d.ori}\n🏁 Destino: ${d.des}\n📏 Distancia: ${d.km} KM\n⏱️ Tiempo: ${d.horas}h ${d.mins}m\n💰 *Total: $${d.total.toFixed(2)}*\n_¡Buen viaje!_`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
    }
</script>

</body>
</html>
