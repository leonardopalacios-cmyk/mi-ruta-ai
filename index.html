<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 RUTAS AI PRO - PLATINUM EDITION</title>
    <style>
        :root {
            --primary: #00d4ff; --secondary: #7000ff; --accent: #2ecc71;
            --danger: #e94560; --bg: #05050a; --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        .sidebar {
            width: 420px; background: rgba(10, 10, 25, 0.95); backdrop-filter: blur(20px);
            padding: 25px; border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; overflow-y: auto; z-index: 100; box-shadow: 15px 0 50px rgba(0,0,0,0.8);
        }

        h1 { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }

        .input-group { margin-bottom: 12px; }
        label { font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-bottom: 5px; display: block; opacity: 0.8; }
        
        input, select {
            width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: white; font-size: 14px; outline: none; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .vehicle-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .v-option {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .v-option.active { border-color: var(--primary); background: rgba(0, 212, 255, 0.15); box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }
        .v-option span { display: block; font-size: 22px; }

        button {
            width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: 800;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-top: 10px;
        }
        .btn-calc { background: linear-gradient(45deg, var(--secondary), var(--primary)); color: white; box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3); }
        .btn-ws { background: #25d366; color: white; display: none; margin-top: 15px; }

        .results {
            margin-top: 25px; padding: 20px; background: rgba(255,255,255,0.02); border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.08); display: none; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; }
        .stat-card small { display: block; font-size: 9px; color: var(--primary); margin-bottom: 4px; }
        .stat-card div { font-size: 16px; font-weight: bold; }

        /* Progress Bar */
        .cost-bar-container { height: 8px; background: #222; border-radius: 4px; margin: 15px 0; overflow: hidden; display: flex; }
        .bar-fuel { background: var(--secondary); height: 100%; }
        .bar-toll { background: var(--primary); height: 100%; }

        .total-box { font-size: 30px; text-align: center; color: var(--accent); font-weight: 900; margin: 15px 0; text-shadow: 0 0 20px rgba(46, 204, 113, 0.3); }

        .eco-tag { font-size: 11px; background: rgba(46, 204, 113, 0.1); color: var(--accent); padding: 5px 10px; border-radius: 20px; display: inline-block; margin-top: 10px; }

        #map-container { flex: 1; }
        iframe { width: 100%; height: 100%; border: none; filter: invert(90%) hue-rotate(180deg) brightness(0.95); }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>RUTA AI PLATINUM</h1>
    
    <div class="input-group">
        <label>📍 Punto de Partida</label>
        <input type="text" id="o" list="cities" placeholder="Ciudad de Origen">
    </div>

    <div class="input-group">
        <label>🏁 Punto de Destino</label>
        <input type="text" id="d" list="cities" placeholder="Ciudad de Destino">
    </div>

    <label>🚜 Vehículo y Rendimiento</label>
    <div class="vehicle-selector">
        <div class="v-option" onclick="setVehicle('moto', 25, 0.5, this)"><span>🏍️</span><small>MOTO</small></div>
        <div class="v-option active" onclick="setVehicle('auto', 12, 1, this)"><span>🚗</span><small>AUTO</small></div>
        <div class="v-option" onclick="setVehicle('heavy', 4, 3.5, this)"><span>🚛</span><small>CARGA</small></div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
        <div class="input-group">
            <label>⛽ Precio L</label>
            <input type="number" id="p" value="24.50">
        </div>
        <div class="input-group">
            <label>🔄 Redondo</label>
            <select id="round-trip" onchange="calcular()">
                <option value="1">Solo Ida</option>
                <option value="2">Ida y Vuelta</option>
            </select>
        </div>
    </div>

    <button class="btn-calc" onclick="calcular()">Analizar Ruta Inteligente</button>
    
    <div id="res-box" class="results">
        <div class="stats-grid">
            <div class="stat-card"><small>TIEMPO EST.</small><div id="time-txt">--</div></div>
            <div class="stat-card"><small>DISTANCIA</small><div id="dist-txt">--</div></div>
        </div>

        <label>Desglose de Gastos (Gasolina vs Casetas)</label>
        <div class="cost-bar-container">
            <div id="bar-fuel" class="bar-fuel" style="width: 50%;"></div>
            <div id="bar-toll" class="bar-toll" style="width: 50%;"></div>
        </div>

        <div class="res-item" style="display:flex; justify-content:space-between; font-size:12px; opacity:0.7;">
            <span>Combustible: <b id="fuel-txt"></b></span>
            <span>Casetas: <b id="toll-txt"></b></span>
        </div>

        <div class="total-box" id="total-txt">$0.00</div>
        
        <div style="text-align: center;">
            <div class="eco-tag">🍃 Huella CO2: <span id="co2-txt">0</span> kg</div>
        </div>

        <button class="btn-ws" id="btn-ws" onclick="shareWS()">📱 Enviar Reporte a WhatsApp</button>
    </div>

    <datalist id="cities">
        <option value="Ciudad de México"> <option value="Guadalajara"> <option value="Monterrey">
        <option value="Puebla"> <option value="Querétaro"> <option value="Acapulco">
        <option value="Cancún"> <option value="Mérida"> <option value="San Luis Potosí">
    </datalist>
</div>

<div id="map-container">
    <iframe id="mapa" src="https://maps.google.com/maps?q=Mexico&output=embed"></iframe>
</div>

<script>
    let currentTollMult = 1;
    let avgSpeed = 95; // km/h
    let lastResult = {};

    function setVehicle(type, rend, tollMult, el) {
        document.querySelectorAll('.v-option').forEach(opt => opt.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('r-hidden').value = rend; // Rendimiento oculto o dinámico
        currentTollMult = tollMult;
        avgSpeed = type === 'heavy' ? 75 : 95;
        calcular();
    }

    // Rendimiento dinámico oculto
    const hiddenRend = document.createElement('input');
    hiddenRend.id = 'r-hidden'; hiddenRend.type = 'hidden'; hiddenRend.value = '12';
    document.body.appendChild(hiddenRend);

    function calcular() {
        const ori = document.getElementById('o').value.trim();
        const des = document.getElementById('d').value.trim();
        const pre = parseFloat(document.getElementById('p').value);
        const ren = parseFloat(document.getElementById('r-hidden').value);
        const mult = parseInt(document.getElementById('round-trip').value);

        if(!ori || !des) return;

        // Base de datos de distancias
        const DB = { 
            "Ciudad de México-Guadalajara": 550, "Ciudad de México-Acapulco": 380,
            "Ciudad de México-Monterrey": 900, "Ciudad de México-Puebla": 135,
            "Ciudad de México-Querétaro": 213, "Guadalajara-Monterrey": 790
        };

        let km = (DB[`${ori}-${des}`] || DB[`${des}-${ori}`] || Math.floor(Math.abs(ori.length - des.length) * 45 + 150)) * mult;
        let baseCasetas = (km * 1.1) * currentTollMult; // Estimación inteligente

        const costoFuel = (km / ren) * pre;
        const total = costoFuel + baseCasetas;
        
        // Tiempo estimado
        const horas = Math.floor(km / avgSpeed);
        const minutos = Math.round(((km / avgSpeed) - horas) * 60);

        // CO2: ~2.31 kg por litro de gasolina
        const co2 = (km / ren) * 2.31;

        // UI
        document.getElementById('res-box').style.display = 'block';
        document.getElementById('dist-txt').innerText = `${km} KM`;
        document.getElementById('time-txt').innerText = `${horas}h ${minutos}m`;
        document.getElementById('fuel-txt').innerText = `$${costoFuel.toFixed(0)}`;
        document.getElementById('toll-txt').innerText = `$${baseCasetas.toFixed(0)}`;
        document.getElementById('total-txt').innerText = `$${total.toLocaleString('es-MX', {minimumFractionDigits:2})}`;
        document.getElementById('co2-txt').innerText = co2.toFixed(1);

        // Visual Bar
        const fuelPer = (costoFuel / total) * 100;
        document.getElementById('bar-fuel').style.width = fuelPer + "%";
        document.getElementById('bar-toll').style.width = (100 - fuelPer) + "%";

        document.getElementById('btn-ws').style.display = 'block';
        document.getElementById('mapa').src = `https://www.google.com/maps?q=${encodeURIComponent(ori)}+to+${encodeURIComponent(des)}&output=embed`;

        lastResult = { ori, des, km, total, time: `${horas}h ${minutos}m`, co2: co2.toFixed(1) };
    }

    function shareWS() {
        const msg = `📍 *LOGÍSTICA DE VIAJE AI*\n\n` +
                    `🚩 *Ruta:* ${lastResult.ori} ➔ ${lastResult.des}\n` +
                    `📏 *Distancia:* ${lastResult.km} KM\n` +
                    `⏱️ *Tiempo:* ${lastResult.time}\n` +
                    `💰 *Presupuesto Total:* $${lastResult.total.toFixed(2)}\n` +
                    `🍃 *CO2:* ${lastResult.co2} kg\n\n` +
                    `_Generado por Ruta AI Platinum_`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>

</body>
</html>
